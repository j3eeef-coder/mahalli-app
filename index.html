<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<title>محلي — تجربة حية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;background:#f5f7fb;color:#172033}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e8ebf0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:900}.sub{font-size:12px;color:#718096}.wrap{max-width:680px;margin:auto;padding:16px 14px 90px}
.hero{background:linear-gradient(135deg,#1769e0,#4d8ff1);color:white;border-radius:24px;padding:20px;box-shadow:0 10px 30px #1769e025}
.hero h1{margin:0 0 5px;font-size:24px}.hero p{margin:0;opacity:.9}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:#ffffff22;border:1px solid #ffffff33;border-radius:15px;padding:12px}.stat b{display:block;font-size:19px;margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}.card{background:#fff;border:1px solid #e8ebf0;border-radius:18px;padding:16px;box-shadow:0 3px 14px #15223808}.action{cursor:pointer;min-height:108px;text-align:right}.action .ico{font-size:28px}.action b{display:block;margin-top:10px;font-size:16px}.action small{color:#718096}
.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 10px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:800}.primary{background:#1769e0;color:#fff}.light{background:#eef4ff;color:#1769e0}.danger{background:#fff0f0;color:#b42318}.input{width:100%;padding:12px;border:1px solid #dfe4ec;border-radius:12px;background:#fff;margin:5px 0}
.list{display:flex;flex-direction:column;gap:8px}.item{background:#fff;border:1px solid #e8ebf0;border-radius:14px;padding:12px}.item b{display:block}.muted{color:#718096;font-size:13px}.pill{display:inline-block;background:#eef4ff;color:#1769e0;border-radius:20px;padding:5px 9px;font-size:12px;margin-top:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8ebf0;display:flex;justify-content:center;z-index:10}nav button{background:none;color:#657083;border-radius:0;flex:1;max-width:160px;font-size:12px}nav button span{display:block;font-size:20px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;border-radius:24px 24px 0 0;padding:20px;width:100%;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}
.scanbox{height:220px;border-radius:20px;background:#101827;color:white;display:flex;align-items:center;justify-content:center;text-align:center;border:3px dashed #6b7280;margin-bottom:12px}.scanbox .frame{border:2px solid #70a3ff;border-radius:16px;padding:45px 55px}
.ai{background:#f1f7ff;border:1px solid #cfe0ff;border-radius:16px;padding:14px}.ai b{color:#1769e0}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(4,1fr)}.hero{padding:24px}}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.quick button{min-height:64px}
.productpick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.productpick button{text-align:right;background:#f8fafc;border:1px solid #e5e7eb}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.badge{font-size:11px;background:#e9f8ef;color:#147a3d;border-radius:999px;padding:5px 9px;font-weight:800}
.kpi{font-size:12px;color:#667085}.kpi b{font-size:16px;color:#172033;display:block;margin-top:2px}

.cartrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f4}
.qtybtn{padding:7px 10px;background:#eef4ff;color:#1769e0;border-radius:9px}
.aiinput{min-height:150px;resize:vertical;line-height:1.7}
.parsed{background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-top:10px}
.editgrid{display:grid;grid-template-columns:1fr 90px;gap:7px;align-items:center}

.onboard{position:fixed;inset:0;background:#f5f7fb;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.onboardbox{background:#fff;border-radius:28px;padding:25px;max-width:520px;width:100%;box-shadow:0 20px 60px #17203320}
.onboardbox h1{font-size:30px;margin:0 0 8px}.onboardbox .big{font-size:50px}
.homeSearch{display:flex;gap:8px;margin-top:12px}.homeSearch input{margin:0}
.chips{display:flex;gap:7px;overflow:auto;padding:3px 0 5px}.chip{white-space:nowrap;background:#fff;border:1px solid #e4e8ef;padding:8px 12px;border-radius:999px}
.alert{background:#fff8e7;border:1px solid #f4d58a;border-radius:16px;padding:13px;margin-top:12px}
.dangerText{color:#b42318}.successText{color:#147a3d}
.bigbtn{min-height:74px;font-size:17px}
.empty{text-align:center;padding:28px 10px;color:#718096}
table{width:100%;border-collapse:collapse}td,th{padding:9px 5px;border-bottom:1px solid #edf0f4;text-align:right;font-size:13px}

.pricebox{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pricebox .input{margin:0}
.aiExample{background:#f8fafc;border:1px dashed #cfd6e2;border-radius:14px;padding:12px;line-height:1.8}
</style>
</head>
<body>
<header><div><div class="logo">محلي <span class="badge">PROTOTYPE</span></div><div class="sub">نظام تشغيل المحل — سريع، ذكي، بدون اشتراك</div></div><button class="light" onclick="openAI()">✨ AI</button></header>
<main class="wrap" id="app"></main>
<nav>
<button onclick="home()"><span>🏠</span>الرئيسية</button>
<button onclick="inventory()"><span>📦</span>المخزون</button>
<button onclick="reports()"><span>📊</span>التقارير</button>
<button onclick="openAI()"><span>🤖</span>المساعد</button><button onclick="settings()"><span>⚙️</span>إعدادات</button>
</nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='mahalli_demo_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 products:[
  {id:1,name:'تيشيرت أسود',size:'L',color:'أسود',barcode:'100001',buy:8000,sell:15000,qty:12},
  {id:2,name:'جينز أزرق',size:'32',color:'أزرق',barcode:'100002',buy:18000,sell:30000,qty:7},
  {id:3,name:'هودي رمادي',size:'XL',color:'رمادي',barcode:'100003',buy:22000,sell:38000,qty:3}
 ], sales:[], expenses:[], debts:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return Math.round(n).toLocaleString('ar-IQ')+' د.ع'}
function today(){return new Date().toISOString().slice(0,10)}
function todaySales(){return db.sales.filter(x=>x.date===today())}
function totals(){let s=todaySales();return {sales:s.reduce((a,x)=>a+x.total,0),profit:s.reduce((a,x)=>a+x.profit,0),stock:db.products.reduce((a,x)=>a+x.qty,0),debt:db.debts.reduce((a,x)=>a+(x.amount-x.paid),0)}}

function hasStore(){return localStorage.getItem('mahalli_store_name')}
function firstRun(){
 if(hasStore())return;
 document.body.insertAdjacentHTML('beforeend',`<div class="onboard" id="onboard"><div class="onboardbox" dir="rtl">
 <div class="big">🏪</div><h1>خل نجهز «محلي»</h1><p class="muted">أول مرة تستخدمه؟ اكتب اسم محلك فقط، والباقي نسويه خطوة خطوة.</p>
 <input id="storeName" class="input" placeholder="اسم المحل">
 <button class="primary bigbtn" style="width:100%;margin-top:8px" onclick="finishSetup()">ابدأ محلي 🚀</button>
 <p class="muted" style="font-size:11px">تقدر تغيّر الاسم لاحقاً من الإعدادات.</p>
 </div></div>`);
}
function finishSetup(){let n=document.getElementById('storeName').value.trim()||'محلي';localStorage.setItem('mahalli_store_name',n);document.getElementById('onboard')?.remove();home()}
function storeName(){return localStorage.getItem('mahalli_store_name')||'محلي'}
function globalSearch(){
 let q=(document.getElementById('globalQ')?.value||'').trim().toLowerCase();
 if(!q)return inventory();
 let arr=db.products.filter(p=>`${p.name} ${p.size||''} ${p.color||''} ${p.barcode||''}`.toLowerCase().includes(q));
 app.innerHTML=`<div class="topbar"><div><h2 style="margin:0">🔎 نتائج البحث</h2><span class="muted">${arr.length} منتج</span></div><button class="light" onclick="home()">رجوع</button></div>
 <div class="list">${arr.map(p=>`<div class="item" onclick="quickProduct(${p.id})"><b>${p.name}</b><div class="muted">${p.size||''} ${p.color||''} • باركود ${p.barcode||'—'}</div><span class="pill">${p.qty} قطعة</span> <span class="pill">${money(p.sell)}</span></div>`).join('')||'<div class="empty">ما لقينا المنتج.</div>'}</div>`;
}
function quickProduct(id){let p=db.products.find(x=>x.id===id);openModal(`<h2>${p.name}</h2><div class="card"><b>${p.qty} قطعة</b><div class="muted">${p.size||''} ${p.color||''} • ${money(p.sell)}</div></div><div class="quick"><button class="primary" onclick="cart=[];addToCart(${id});manualSale()">🛒 بيع</button><button class="light" onclick="doAddPrompt(${id})">📦 إضافة</button></div>`)}
function doAddPrompt(id){let q=prompt('كم قطعة تريد إضافتها؟','1');q=+q;if(q>0){let p=db.products.find(x=>x.id===id);p.qty+=q;save();closeModal();home()}}
function settings(){
 openModal(`<h2>⚙️ إعدادات</h2><label>اسم المحل</label><input id="newStore" class="input" value="${storeName()}">
 <button class="primary" style="width:100%" onclick="localStorage.setItem('mahalli_store_name',newStore.value||'محلي');closeModal();home()">حفظ</button>
 <button class="danger" style="width:100%;margin-top:8px" onclick="if(confirm('مسح بيانات التجربة؟')){localStorage.removeItem('${KEY}');location.reload()}">مسح بيانات التجربة</button>`);
}
function home(){
 let t=totals(), low=db.products.filter(p=>p.qty<=3);
 app.innerHTML=`<section class="hero">
 <div class="topbar"><div><h1>${storeName()} 👋</h1><p>كل شغلك بمكان واحد.</p></div><button class="light" onclick="settings()">⚙️</button></div>
 <div class="homeSearch"><input id="globalQ" class="input" placeholder="🔎 ابحث عن منتج أو باركود" onkeydown="if(event.key==='Enter')globalSearch()"><button class="light" onclick="globalSearch()">بحث</button></div>
 <div class="stats"><div class="stat">مبيعات اليوم<b>${money(t.sales)}</b></div><div class="stat">الربح اليوم<b>${money(t.profit)}</b></div><div class="stat">المخزون<b>${t.stock}</b></div><div class="stat">الديون<b>${money(t.debt)}</b></div></div></section>
 <section class="chips">
 <button class="chip" onclick="saleChoice()">🛒 بيع</button><button class="chip" onclick="aiStockFlow()">✨ AI بضاعة</button><button class="chip" onclick="inventory()">📦 مخزون</button><button class="chip" onclick="reports()">📊 تقرير</button><button class="chip" onclick="debtFlow()">👤 دين</button>
 </section>
 ${low.length?`<div class="alert"><b>🚨 انتبه للمخزون</b><div class="muted">${low.slice(0,4).map(p=>`${p.name} (${p.qty})`).join(' • ')}</div></div>`:''}
 <section class="grid">
 <div class="card action bigbtn" onclick="saleChoice()"><div class="ico">🛒</div><b>بيع</b><small>باركود أو اختيار يدوي</small></div>
 <div class="card action bigbtn" onclick="returnChoice()"><div class="ico">🔄</div><b>إرجاع</b><small>بسرعة وبلا تعقيد</small></div>
 <div class="card action" onclick="aiStockFlow()"><div class="ico">✨</div><b>إضافة بالـAI</b><small>اكتب البضاعة بطريقتك</small></div>
 <div class="card action" onclick="inventory()"><div class="ico">📦</div><b>المخزون</b><small>بحث، قياسات، ألوان</small></div>
 <div class="card action" onclick="expenseFlow()"><div class="ico">💰</div><b>المصاريف</b><small>سجلها بثواني</small></div>
 <div class="card action" onclick="debtFlow()"><div class="ico">👤</div><b>الديون</b><small>من عليه؟ وشكد؟</small></div>
 <div class="card action" onclick="reports()"><div class="ico">📊</div><b>التقارير</b><small>ربح ومبيعات وتنبيهات</small></div>
 <div class="card action" onclick="openAI()"><div class="ico">🤖</div><b>المساعد الذكي</b><small>اسأل عن محلك</small></div>
 </div>
 <section class="section"><div class="card"><b>💡 محلي يتعلم من شغلك</b><p class="muted">كل ما تسجل مبيعاتك ومصاريفك، نقدر نخلي المساعد يعطيك قرارات أدق: شنو تشتري، شنو ناقص، وشنو ما يتحرك.</p></div></section>`;
}
function find(code){return db.products.find(p=>p.barcode===code)}


let cart=[];
let pendingAIStock=[];

function productLabel(p){return `${p.name}${p.size?' — '+p.size:''}${p.color?' • '+p.color:''}`}

function manualSale(){
 openModal(`<h2>👆 بيع سريع</h2>
 <input id="prodSearch" class="input" placeholder="🔎 ابحث باسم المنتج / القياس / اللون" oninput="renderProductPicker()">
 <div id="productPicker" class="productpick"></div>
 <div class="card" style="margin-top:12px"><b>🛒 السلة</b><div id="cartBox"></div></div>
 <button class="primary" style="width:100%;margin-top:10px" onclick="checkout()">إتمام البيع</button>`);
 renderProductPicker(); renderCart();
}

function renderProductPicker(){
 let q=(document.getElementById('prodSearch')?.value||'').toLowerCase().trim();
 let arr=db.products.filter(p=>`${p.name} ${p.size||''} ${p.color||''}`.toLowerCase().includes(q));
 let box=document.getElementById('productPicker'); if(!box)return;
 box.innerHTML=arr.map(p=>`<button onclick="addToCart(${p.id})"><b>${p.name}</b><br><span class="muted">${p.size||''} ${p.color||''} • ${p.qty} متوفر</span><br><span class="pill">${money(p.sell)}</span></button>`).join('')||'<div class="muted">ماكو منتج مطابق.</div>';
}
function addToCart(id){
 let p=db.products.find(x=>x.id===id);
 let item=cart.find(x=>x.productId===id);
 if(item){if(item.qty>=p.qty)return alert('ماكو كمية كافية بالمخزون');item.qty++}else cart.push({productId:id,qty:1});
 renderCart();
}
function renderCart(){
 let box=document.getElementById('cartBox'); if(!box)return;
 if(!cart.length){box.innerHTML='<p class="muted">السلة فارغة.</p>';return}
 let total=0;
 box.innerHTML=cart.map(i=>{let p=db.products.find(x=>x.id===i.productId);total+=p.sell*i.qty;return `<div class="cartrow"><div><b>${p.name}</b><div class="muted">${p.size||''} ${p.color||''}</div></div><div class="row"><button class="qtybtn" onclick="changeCart(${p.id},-1)">−</button><b>${i.qty}</b><button class="qtybtn" onclick="changeCart(${p.id},1)">+</button></div></div>`}).join('')+`<div style="padding-top:12px"><b>الإجمالي: ${money(total)}</b></div>`;
}
function changeCart(id,d){
 let p=db.products.find(x=>x.id===id),i=cart.find(x=>x.productId===id); if(!i)return;
 if(d>0 && i.qty>=p.qty)return;
 i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x.productId!==id);renderCart();
}
function checkout(){
 if(!cart.length)return alert('السلة فارغة');
 let total=cart.reduce((a,i)=>{let p=db.products.find(x=>x.id===i.productId);return a+p.sell*i.qty},0);
 openModal(`<h2>💳 إتمام البيع</h2><div class="card"><b>الإجمالي: ${money(total)}</b><div class="muted">${cart.length} منتجات</div></div>
 <p class="muted">طريقة الدفع</p><div class="quick">
 <button class="light" onclick="completeCart('نقدي')">💵 نقدي</button>
 <button class="light" onclick="completeCart('بطاقة')">💳 بطاقة</button>
 <button class="light" onclick="completeCart('آجل')">👤 آجل</button></div>`);
}
function completeCart(method){
 let total=0,profit=0;
 for(const i of cart){let p=db.products.find(x=>x.id===i.productId);if(i.qty>p.qty)return alert(`الكمية غير كافية: ${p.name}`);p.qty-=i.qty;total+=p.sell*i.qty;profit+=(p.sell-p.buy)*i.qty}
 db.sales.push({id:Date.now(),items:cart.map(x=>({...x})),qty:cart.reduce((a,x)=>a+x.qty,0),total,profit,date:today(),payment:method});
 if(method==='آجل'){
   openModal(`<h2>👤 بيع آجل</h2><p>الإجمالي: <b>${money(total)}</b></p><input id="creditName" class="input" placeholder="اسم الزبون"><button class="primary" style="width:100%" onclick="saveCredit(${total})">حفظ الدين</button>`);
   save(); return;
 }
 cart=[];save();closeModal();home();
}
function saveCredit(total){db.debts.push({customer:creditName.value||'زبون',amount:total,paid:0,date:today()});cart=[];save();closeModal();home()}

function aiStockFlow(){
 openModal(`<h2>🤖 إضافة بضاعة بالذكاء الاصطناعي</h2>
 <p class="muted">اكتبها بطريقتك، ومحلي يستخرج <b>الكمية + القياسات + اللون + سعر الشراء + سعر البيع</b>.</p>
 <div class="aiExample">مثال:<br><b>جبت ٥٠ تراك سود، سعر القطعة ١٠ آلاف وأبيعها بـ١٥ ألف، القياسات S 10 و M 20 و L 20.</b><br><br>
 أو:<br><b>جبت ١٠ فانيلات حمر، الكلفة ٧ آلاف للقطعة وأبيعها ١٢ ألف، M 5 و L 5.</b></div>
 <textarea id="aiStockText" class="input aiinput" placeholder="اكتب تفاصيل البضاعة هنا..."></textarea>
 <button class="primary" style="width:100%" onclick="parseAIStock()">✨ حلّل وأجهز المخزون</button>
 <div class="muted" style="margin-top:8px">راح يعرض لك النتيجة للمراجعة قبل ما يضيف أي شيء للمخزون.</div>`);
}
function normalizeDigits(s){
 return s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
}
function parseAIStock(){
 const text=normalizeDigits(document.getElementById('aiStockText').value.trim());
 if(!text)return alert('اكتب تفاصيل البضاعة أولاً');

 const colors=['أسود','اسود','أحمر','احمر','أبيض','ابيض','أزرق','ازرق','نيلي','رمادي','أخضر','اخضر','بيج','بني','وردي','موف'];
 const productRegex=/(?:جبت|اشتريت|وصلني|وصلت|أخذت)\s*(\d+)\s*([^،;]+?)(?=(?:\s+و?\s*(?:جبت|اشتريت|وصلني|وصلت|أخذت)\s*\d+)|$)/gi;
 let direct=[],mm;
 while((mm=productRegex.exec(text))!==null){
   let qty=+mm[1], desc=mm[2].trim();
   let sizes=[...desc.matchAll(/\b(S|M|L|XL|XXL|XXXL)\s*(\d+)/gi)].map(x=>({size:x[1].toUpperCase(),qty:+x[2]}));
   let buyM=desc.match(/(?:سعر\s*(?:الشراء|القطعة)|كلفة|التكلفة|اشتريتها?)\s*(?:هو|هي|ب)?\s*(\d+(?:\.\d+)?)\s*(?:الف|ألف|آلاف|دينار)?/i);
   let sellM=desc.match(/(?:أبيعها|ابيعه(?:ا)?|سعر\s*البيع|البيع)\s*(?:ب|هو|هي)?\s*(\d+(?:\.\d+)?)\s*(?:الف|ألف|آلاف|دينار)?/i);
   function moneyWord(m){if(!m)return 0;let n=+m[1];return /الف|ألف|آلاف/i.test(m[0])?n*1000:n}
   let buy=moneyWord(buyM),sell=moneyWord(sellM);
   desc=desc.replace(/(?:سعر\s*(?:الشراء|القطعة)|كلفة|التكلفة|اشتريتها?)\s*(?:هو|هي|ب)?\s*\d+(?:\.\d+)?\s*(?:الف|ألف|آلاف|دينار)?/ig,'');
   desc=desc.replace(/(?:أبيعها|ابيعه(?:ا)?|سعر\s*البيع|البيع)\s*(?:ب|هو|هي)?\s*\d+(?:\.\d+)?\s*(?:الف|ألف|آلاف|دينار)?/ig,'');
   desc=desc.replace(/القياسات.*$/i,'').trim();
   let color=colors.find(c=>desc.includes(c))||'';
   desc=desc.replace(/لون\s*(أسود|اسود|أحمر|احمر|أبيض|ابيض|أزرق|ازرق|نيلي|رمادي|أخضر|اخضر|بيج|بني|وردي|موف)/,'').trim();
   direct.push({name:desc.replace(/\s+/g,' '),qty:sizes.length?sizes.reduce((a,x)=>a+x.qty,0):qty,color,sizes,buy,sell});
 }
 if(direct.length){pendingAIStock=direct;renderAIConfirm();return}

 // Single-product fallback.
 let m=text.match(/(?:جبت|اشتريت)\s*(\d+)\s*(.*)/i);
 if(m){
   let desc=m[2], buyM=desc.match(/(?:سعر\s*(?:الشراء|القطعة)|كلفة)\s*(?:ب|هو|هي)?\s*(\d+)\s*(?:الف|ألف|دينار)?/i);
   let sellM=desc.match(/(?:أبيعها|ابيعه(?:ا)?|سعر\s*البيع)\s*(?:ب|هو|هي)?\s*(\d+)\s*(?:الف|ألف|دينار)?/i);
   let mw=x=>x?(+x[1]*(/الف|ألف/i.test(x[0])?1000:1)):0;
   pendingAIStock=[{name:desc,qty:+m[1],color:'',sizes:[],buy:mw(buyM),sell:mw(sellM)}];
   renderAIConfirm();return;
 }
 alert('ما قدرت أفهم التفاصيل. جرّب: جبت ٥٠ تراك، الكلفة ١٠ آلاف وأبيعها بـ١٥ ألف.');
}
function renderAIConfirm(){
 if(!pendingAIStock.length){alert('ما قدرت أفهم تفاصيل البضاعة.');return}
 openModal(`<h2>🤖 راجع البضاعة قبل الحفظ</h2><p class="muted">محلي فهم الآتي. تقدر تعدل الأسعار قبل الإضافة.</p>
 ${pendingAIStock.map((p,i)=>`<div class="parsed">
 <b>${p.name||'منتج'}</b>
 <div class="muted">اللون: ${p.color||'—'} • الكمية: ${p.qty}${p.sizes?.length?` • القياسات: ${p.sizes.map(s=>s.size+' × '+s.qty).join('، ')}`:''}</div>
 <div class="pricebox">
 <input id="buy_${i}" class="input" type="number" value="${p.buy||0}" placeholder="سعر الشراء">
 <input id="sell_${i}" class="input" type="number" value="${p.sell||0}" placeholder="سعر البيع">
 </div>
 <div class="muted" id="profit_${i}">الربح المتوقع: ${money(((p.sell||0)-(p.buy||0))*p.qty)}</div>
 </div>`).join('')}
 <button class="primary" style="width:100%;margin-top:12px" onclick="commitAIStock()">✅ إضافة للمخزون</button>`);
 pendingAIStock.forEach((p,i)=>{
   const b=document.getElementById('buy_'+i),s=document.getElementById('sell_'+i),out=document.getElementById('profit_'+i);
   const upd=()=>out.textContent='الربح المتوقع: '+money(((+s.value||0)-(+b.value||0))*(p.qty||0));
   b?.addEventListener('input',upd);s?.addEventListener('input',upd);
 });
}
function commitAIStock(){
 pendingAIStock.forEach((item,i)=>{
   item.buy=+(document.getElementById('buy_'+i)?.value||item.buy||0);
   item.sell=+(document.getElementById('sell_'+i)?.value||item.sell||0);
 });
 for(const item of pendingAIStock){
   if(item.sizes?.length){
     for(const s of item.sizes){
       let name=item.name, existing=db.products.find(p=>p.name===name&&p.color===item.color&&p.size===s.size);
       if(existing)existing.qty+=s.qty;
       else db.products.push({id:Date.now()+Math.random(),name,barcode:'',size:s.size,color:item.color,buy:item.buy||0,sell:item.sell||0,qty:s.qty});
     }
   }else{
     let existing=db.products.find(p=>p.name===item.name&&p.color===item.color&&(!item.size||p.size===item.size));
     if(existing)existing.qty+=item.qty;
     else db.products.push({id:Date.now()+Math.random(),name:item.name,barcode:'',size:item.size||'',color:item.color||'',buy:item.buy||0,sell:item.sell||0,qty:item.qty});
   }
 }
 pendingAIStock=[];save();closeModal();inventory();
}
function saleChoice(){
 openModal(`<h2>🛒 طريقة البيع</h2>
 <p class="muted">اختار الأسرع إلك حسب وضع المحل.</p>
 <div class="quick">
 <button class="primary" onclick="scanSheet('بيع بالباركود','sell')">📷<br>باركود</button>
 <button class="light" onclick="manualSale()">👆<br>اختيار يدوي</button>
 </div>
 <div class="card" style="margin-top:12px"><b>💡 نصيحة</b><p class="muted">وقت الزحمة استخدم الاختيار اليدوي. والباركود مفيد للجرد والسرعة لما تكون القطعة قدامك.</p></div>`);
}
function returnChoice(){
 openModal(`<h2>🔄 طريقة الإرجاع</h2>
 <div class="quick">
 <button class="primary" onclick="scanSheet('إرجاع بالباركود','return')">📷<br>باركود</button>
 <button class="light" onclick="manualReturn()">👆<br>اختيار يدوي</button>
 </div>`);
}
function manualSale(){
 openModal(`<h2>👆 بيع سريع</h2><p class="muted">اختار المنتج بدون باركود.</p><div class="productpick">
 ${db.products.map(p=>`<button onclick="manualQty(${p.id},'sell')"><b>${p.name}</b><br><span class="muted">${p.size||''} • ${p.qty} متوفر</span><br><span class="pill">${money(p.sell)}</span></button>`).join('')}
 </div>`);
}
function manualReturn(){
 openModal(`<h2>👆 إرجاع سريع</h2><div class="productpick">
 ${db.products.map(p=>`<button onclick="manualQty(${p.id},'return')"><b>${p.name}</b><br><span class="muted">${p.size||''} • ${money(p.sell)}</span></button>`).join('')}
 </div>`);
}
function manualQty(id,mode){
 let p=db.products.find(x=>x.id===id);
 openModal(`<h2>${mode==='sell'?'🟢 بيع':'🔄 إرجاع'} — ${p.name}</h2>
 <div class="card"><div class="topbar"><b>${p.name}</b><span class="badge">${p.qty} متوفر</span></div>
 <div class="kpi">سعر البيع<b>${money(p.sell)}</b></div></div>
 <label>عدد القطع</label><input id="qty" class="input" type="number" min="1" ${mode==='sell'?`max="${p.qty}"`:''} value="1">
 <button class="primary" style="width:100%" onclick="${mode==='sell'?`doSale(${id})`:`doReturn(${id})`}">${mode==='sell'?'تم البيع ✅':'تأكيد الإرجاع'}</button>`);
}
function scanSheet(title,mode){
 openModal(`<h2>${title}</h2><div class="scanbox"><div class="frame">📷<br><b>هنا كاميرا الباركود</b><br><span class="muted" style="color:#cbd5e1">في النسخة الهاتفية نربط الكاميرا الفعلية هنا</span></div></div>
 <label>للتجربة الآن: أدخل باركود</label><input id="code" class="input" inputmode="numeric" placeholder="مثلاً 100001">
 <button class="primary" style="width:100%" onclick="lookup('${mode}')">🔎 قراءة المنتج</button>
 <div class="muted" style="margin-top:8px">جرب 100001 أو 100002 أو 100003</div>`);
}
function lookup(mode){
 let p=find(document.getElementById('code').value.trim());
 if(!p){openModal(`<h2>📦 منتج جديد</h2><p class="muted">الباركود <b>${document.getElementById('code').value}</b> غير مسجل. نكمل إنشاء المنتج بدون ما تعيد كتابة الباركود.</p><button class="primary" style="width:100%" onclick="newProductWithBarcode('${document.getElementById('code').value}')">إنشاء المنتج</button>`);return}
 let extra=`<div class="card"><b>${p.name}</b><div class="muted">${p.color||''} ${p.size||''} • المتوفر ${p.qty} • البيع ${money(p.sell)}</div></div>`;
 if(mode==='sell') openModal(`<h2>🟢 ${p.name}</h2>${extra}<label>عدد القطع</label><input id="qty" class="input" type="number" min="1" max="${p.qty}" value="1"><button class="primary" style="width:100%" onclick="doSale(${p.id})">تم البيع ✅</button>`);
 if(mode==='return') openModal(`<h2>🔄 إرجاع</h2>${extra}<label>عدد القطع</label><input id="qty" class="input" type="number" min="1" value="1"><button class="primary" style="width:100%" onclick="doReturn(${p.id})">تأكيد الإرجاع</button>`);
 if(mode==='add') openModal(`<h2>📦 إضافة كمية</h2>${extra}<label>الكمية المضافة</label><input id="qty" class="input" type="number" min="1" value="1"><button class="primary" style="width:100%" onclick="doAdd(${p.id})">إضافة للمخزون</button>`);
}
function sellFlow(){scanSheet('بيع قطعة','sell')}
function returnFlow(){scanSheet('إرجاع قطعة','return')}
function addFlow(){scanSheet('إضافة بضاعة','add')}
function doSale(id){let p=db.products.find(x=>x.id===id),q=+document.getElementById('qty').value||1;if(q>p.qty)return alert('الكمية أكبر من المخزون');p.qty-=q;db.sales.push({id:Date.now(),productId:id,qty:q,total:q*p.sell,profit:q*(p.sell-p.buy),date:today()});save();closeModal();home()}
function doReturn(id){let p=db.products.find(x=>x.id===id),q=+document.getElementById('qty').value||1;p.qty+=q;db.sales.push({id:Date.now(),productId:id,qty:-q,total:-q*p.sell,profit:-q*(p.sell-p.buy),date:today()});save();closeModal();home()}
function doAdd(id){let p=db.products.find(x=>x.id===id),q=+document.getElementById('qty').value||1;p.qty+=q;save();closeModal();home()}
function inventory(){
 app.innerHTML=`<div class="section"><h2>📦 المخزون</h2><div class="quick"><button class="primary" onclick="newProduct()">+ منتج جديد</button><button class="light" onclick="aiStockFlow()">✨ إضافة بالـAI</button></div></div><div class="list" style="margin-top:10px">${db.products.map(p=>`<div class="item"><b>${p.name} — ${p.size||''}</b><div class="muted">${p.color||''} • باركود ${p.barcode}</div><span class="pill">${p.qty} قطعة</span> <span class="pill">${money(p.sell)}</span></div>`).join('')}</div>`;
}
function newProduct(){
 openModal(`<h2>📦 منتج جديد</h2>${[['n','اسم المنتج'],['b','الباركود'],['s','القياس'],['c','اللون'],['buy','سعر الشراء'],['sell','سعر البيع'],['q','الكمية']].map(x=>`<input id="${x[0]}" class="input" placeholder="${x[1]}" ${['buy','sell','q'].includes(x[0])?'type="number"':''}>`).join('')}
 <button class="primary" style="width:100%" onclick="createProduct()">حفظ المنتج</button>`);
}
function newProductWithBarcode(code){
 openModal(`<h2>📦 منتج جديد</h2>
 <input id="n" class="input" placeholder="اسم المنتج"><input id="b" class="input" value="${code}" placeholder="الباركود">
 <input id="s" class="input" placeholder="القياس"><input id="c" class="input" placeholder="اللون">
 <input id="buy" class="input" type="number" placeholder="سعر الشراء"><input id="sell" class="input" type="number" placeholder="سعر البيع">
 <input id="q" class="input" type="number" placeholder="الكمية">
 <button class="primary" style="width:100%" onclick="createProduct()">حفظ المنتج</button>`);
}
function createProduct(){let p={id:Date.now(),name:n.value,barcode:b.value,size:s.value,color:c.value,buy:+buy.value||0,sell:+sell.value||0,qty:+q.value||0};if(!p.name||!p.barcode)return alert('اكتب اسم المنتج والباركود');db.products.push(p);save();closeModal();inventory()}
function expenseFlow(){openModal(`<h2>💰 إضافة مصروف</h2><input id="et" class="input" placeholder="نوع المصروف"><input id="ea" class="input" type="number" placeholder="المبلغ"><button class="primary" style="width:100%" onclick="addExpense()">حفظ</button>`)}
function addExpense(){db.expenses.push({title:et.value,amount:+ea.value||0,date:today()});save();closeModal();home()}
function debtFlow(){openModal(`<h2>👤 إضافة دين</h2><input id="dn" class="input" placeholder="اسم الزبون"><input id="da" class="input" type="number" placeholder="المبلغ"><button class="primary" style="width:100%" onclick="addDebt()">حفظ</button>`)}
function addDebt(){db.debts.push({customer:dn.value,amount:+da.value||0,paid:0,date:today()});save();closeModal();home()}
function reports(){
 let t=totals(), exp=db.expenses.filter(x=>x.date===today()).reduce((a,x)=>a+x.amount,0), net=t.profit-exp;
 let sorted=[...db.products].sort((a,b)=>b.qty-a.qty);
 app.innerHTML=`<section class="section"><h2>📊 التقارير</h2><div class="grid">
 <div class="card"><span class="muted">المبيعات اليوم</span><b>${money(t.sales)}</b></div><div class="card"><span class="muted">الربح الإجمالي</span><b>${money(t.profit)}</b></div>
 <div class="card"><span class="muted">مصاريف اليوم</span><b>${money(exp)}</b></div><div class="card"><span class="muted">الصافي التقريبي</span><b>${money(net)}</b></div></div>
 <div class="card" style="margin-top:12px"><b>⚠️ مخزون منخفض</b>${db.products.filter(p=>p.qty<=3).map(p=>`<p>${p.name}: ${p.qty} قطع</p>`).join('')||'<p class="muted">لا يوجد</p>'}</div>
 <div class="card" style="margin-top:12px"><b>🏆 المنتجات الأعلى بالمخزون</b>${sorted.slice(0,5).map(p=>`<p>${p.name} — ${p.qty} قطعة</p>`).join('')}</div></section>`;
}
function receiptIdea(){
 openModal(`<h2>📸 فاتورة → مخزون</h2><p class="muted">بالنسخة النهائية تصور فاتورة الشراء، والذكاء الاصطناعي يقرأ اسم المنتج والكمية والسعر ثم يعرضها للمراجعة قبل الحفظ.</p>
 <div class="card"><b>التجربة القادمة:</b><p class="muted">صورة الفاتورة → قراءة → مراجعة → إضافة للمخزون.</p></div>
 <button class="primary" style="width:100%" onclick="aiStockFlow()">جرب الإدخال النصي بالـAI الآن</button>`);
}
function openAI(){
 let t=totals(), low=db.products.filter(p=>p.qty<=3), best=[...db.products].sort((a,b)=>b.sell-a.buy-(a.sell-a.buy)).slice(0,3);
 app.innerHTML=`<section class="section"><h2>🤖 المساعد الذكي</h2><div class="ai"><b>تحليل سريع لمحلك</b><p>مبيعات اليوم: ${money(t.sales)}<br>الربح اليوم: ${money(t.profit)}<br>المخزون المنخفض: ${low.length} منتجات</p><p><b>اقتراح:</b> ${low.length?`راجع شراء: ${low.map(p=>p.name).join('، ')}.`:'المخزون المنخفض حالياً تحت السيطرة.'}</p></div>
 <div class="card" style="margin-top:12px"><b>اسأل المساعد</b><input id="aiq" class="input" placeholder="مثلاً: شنو أشتري بمليون؟"><button class="primary" style="width:100%" onclick="answerAI()">حلّل لي 🤖</button><div id="air" style="margin-top:12px"></div></div>
 <div class="card" style="margin-top:12px"><b>النسخة النهائية</b><p class="muted">AI سيقرأ مبيعات ومخزون ومصاريف المحل ويجاوب صاحب المحل، مو مجرد دردشة عامة.</p></div></section>`;
}
function answerAI(){let q=aiq.value;air.innerHTML=`<div class="ai"><b>المساعد:</b><p>حسب البيانات الحالية، أحتاج في النسخة التجارية إلى تحليل المبيعات حسب المنتج والوقت والربح قبل إعطاء قرار شراء دقيق. هذا بالضبط الشيء الذي سنربطه بالذكاء الاصطناعي في المرحلة القادمة.</p></div>`}
function openModal(x){sheet.innerHTML=x;modal.style.display='flex'}function closeModal(){modal.style.display='none'}home(); firstRun();
</script>
</body>
</html>
