<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>محلي | إدارة محلك</title><style>
:root{--bg:#f5f7f8;--card:#fff;--text:#172024;--muted:#68757a;--line:#e2e8e8;--brand:#0f766e;--brand2:#115e59;--soft:#e8f5f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.app{max-width:1050px;margin:auto;padding:18px 15px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:14px;background:var(--brand);color:white;display:grid;place-items:center;font-weight:800;font-size:21px}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0;color:var(--muted);font-size:12px}.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:white}.hero{background:linear-gradient(135deg,#0f766e,#115e59);color:white;border-radius:20px;padding:20px;box-shadow:0 8px 25px #17202412}.heroTop{display:flex;justify-content:space-between;gap:15px}.hero h2{margin:0 0 5px;font-size:21px}.hero p{margin:0;color:#d8f2ef;font-size:13px}.today{background:#fff2;border:1px solid #fff3;border-radius:13px;padding:9px 12px;text-align:center;min-width:105px}.today small{display:block;color:#d8f2ef}.today strong{font-size:18px}.clothing{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;padding:12px;border-radius:15px;background:#ffffff12;border:1px solid #ffffff18}.clothing span{font-size:30px}.clothing small{color:#d8f2ef}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.quick button{background:white;color:var(--text);border:0;border-radius:12px;padding:13px;text-align:right;min-height:67px}.quick b{display:block;font-size:13px}.quick span{font-size:11px;color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.head h3{font-size:16px;margin:0}.link{background:none;color:var(--brand);font-size:12px;border:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 6px 20px #17202409}.stat small{color:var(--muted)}.stat strong{display:block;margin-top:7px;font-size:18px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:13px}.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafcfc;outline:none}.product{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.product:last-child{border:0}.name{font-weight:700;font-size:13px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.badge{background:var(--soft);color:var(--brand2);padding:5px 8px;border-radius:8px;font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{background:#fafcfc;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:right;min-height:72px}.action b{display:block;font-size:12px}.action span{font-size:10px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}.navin{max-width:650px;margin:auto;display:flex;justify-content:space-around;padding:7px 6px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:var(--muted);font-size:12px;min-width:62px;min-height:55px;border-radius:12px;padding:6px 8px}.nav .active{color:var(--brand);font-weight:700;background:var(--soft)}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:flex-end;justify-content:center;padding:15px}.modal.open{display:flex}.sheet{background:white;width:min(620px,100%);border-radius:20px;padding:18px;max-height:88vh;overflow:auto}.sheet h3{margin:0 0 6px}.sheet p{font-size:12px;color:var(--muted)}.field,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:6px 0;background:white;outline:none}.row{display:flex;gap:8px;margin-top:10px}.primary,.secondary{padding:13px 16px;border-radius:11px;border:0;min-height:46px}.primary{background:var(--brand);color:white}.secondary{background:#eef2f2}.qtybox{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0}.qtybtn{width:52px;height:52px;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--brand2);font-size:28px;font-weight:800;line-height:1}.qtyvalue{min-width:58px;text-align:center;font-size:22px;font-weight:800}.qtyhint{text-align:center;color:var(--muted);font-size:11px;margin-top:-3px}.scanbox{padding:28px 16px;text-align:center;background:#f5f7f8;border-radius:14px;font-size:42px}.scanbox small{display:block;font-size:12px;color:var(--muted);margin-top:7px}@media(max-width:700px){.quick,.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.heroTop{align-items:flex-start}.today{min-width:90px}.clothing{justify-content:flex-start}.nav button{min-width:58px}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">م</div><div><h1>محلي</h1><p>إدارة محلك، أبسط وأذكى.</p></div></div><button class="icon" onclick="alert('الإعدادات قيد التطوير')">☰</button></header><section class="hero"><div class="heroTop"><div><h2>هلا بيك 👋</h2><p>تابع المخزون والمبيعات والأرباح من مكان واحد.</p></div><div class="today"><small>مبيعات اليوم</small><strong id="sales">0 د.ع</strong></div></div><div class="clothing"><span>👕</span><span>👖</span><span>👟</span><small>إدارة ملابسك ومخزونك بسرعة</small></div><div class="quick"><button onclick="openM('sale')">⚡ <b>بيع سريع</b><span>كمية − 1 ＋</span></button><button onclick="openM('scan')">📷 <b>الكاميرا</b><span>قراءة تيكت الملابس</span></button><button onclick="openM('add')">＋ <b>إضافة بضاعة</b><span>كمية − 1 ＋</span></button><button onclick="openM('return')">↩️ <b>مرتجع</b><span>إرجاع للمخزون</span></button></div></section><div class="head"><h3>نظرة سريعة</h3></div><section class="stats"><div class="stat"><small>الأرباح</small><strong id="profit">0 د.ع</strong></div><div class="stat"><small>المبيعات</small><strong id="orders">0</strong></div><div class="stat"><small>القطع</small><strong id="units">0</strong></div><div class="stat"><small>منخفض المخزون</small><strong id="low">0</strong></div></section><div class="grid"><section><div class="head"><h3>المخزون</h3><button class="link" onclick="openM('add')">+ إضافة</button></div><div class="card"><input class="search" id="q" oninput="render()" placeholder="ابحث عن منتج..."><div id="list"></div></div></section><section><div class="head"><h3>اختصارات</h3></div><div class="card actions"><button class="action" onclick="openM('add')">📦 <b>إضافة بضاعة</b><span>كمية سريعة</span></button><button class="action" onclick="openM('sale')">🧾 <b>تسجيل بيع</b><span>يخصم من المخزون</span></button><button class="action" onclick="openM('return')">↩️ <b>مرتجع</b><span>يرجع للمخزون</span></button><button class="action" onclick="openM('scan')">📷 <b>الكاميرا</b><span>تعرّف على التيكت</span></button></div></section></div></div><nav class="nav"><div class="navin"><button class="active">⌂<br>الرئيسية</button><button onclick="openM('add')">▦<br>المخزون</button><button onclick="openM('sale')">▤<br>المبيعات</button><button onclick="alert('التقارير قيد التطوير')">◔<br>الأرباح</button><button onclick="alert('الإعدادات قيد التطوير')">⚙<br>الإعدادات</button></div></nav><div class="modal" id="modal"><div class="sheet"><h3 id="mt"></h3><p id="md"></p><div id="mb"></div><div class="row"><button class="secondary" onclick="closeM()">إلغاء</button><button class="primary" id="ok">تم</button></div></div></div><script>
let d=JSON.parse(localStorage.getItem('mahalli')||'null')||{sales:0,profit:0,orders:0,p:[{n:'تراك رياضي - نيلي',q:50,s:'M,L,XL',b:15000,v:25000},{n:'فانيلة - أحمر',q:10,s:'M,L',b:7000,v:12000},{n:'حذاء رياضي',q:6,s:'41,42,43',b:30000,v:45000}]};
const money=n=>Number(n).toLocaleString('ar-IQ')+' د.ع';
function save(){localStorage.setItem('mahalli',JSON.stringify(d))}function render(){let query=document.getElementById('q').value.trim();document.getElementById('list').innerHTML=d.p.filter(x=>x.n.includes(query)).map((x,i)=>`<div class="product"><div><div class="name">${x.n}</div><div class="meta">${x.s||'بدون قياسات'} · شراء ${money(x.b)} · بيع ${money(x.v)}</div></div><span class="badge">${x.q} قطعة</span></div>`).join('')||'<p class="meta">لا توجد منتجات.</p>';let u=d.p.reduce((a,x)=>a+x.q,0);document.getElementById('sales').textContent=money(d.sales);document.getElementById('profit').textContent=money(d.profit);document.getElementById('orders').textContent=d.orders;document.getElementById('units').textContent=u;document.getElementById('low').textContent=d.p.filter(x=>x.q<=5).length}
function qtyControl(id,initial=1,max=null){return `<div class="qtybox"><button type="button" class="qtybtn" onclick="changeQty('${id}',-1)">−</button><div class="qtyvalue" id="${id}">${initial}</div><button type="button" class="qtybtn" onclick="changeQty('${id}',1,${max===null?'null':max})">＋</button></div><div class="qtyhint">الحد الأدنى 1</div>`}function changeQty(id,delta,max=null){let el=document.getElementById(id);if(!el)return;let n=Math.max(1,(parseInt(el.textContent)||1)+delta);if(max!==null)n=Math.min(max,n);el.textContent=n}function getQty(id){return Math.max(1,parseInt(document.getElementById(id)?.textContent)||1)}
function openM(t){document.getElementById('modal').classList.add('open');let mt=document.getElementById('mt'),md=document.getElementById('md'),mb=document.getElementById('mb'),ok=document.getElementById('ok');if(t==='add'){mt.textContent='إضافة بضاعة';md.textContent='أضف المنتج والكمية بسرعة.';mb.innerHTML='<input class="field" id="pn" placeholder="اسم المنتج"><input class="field" id="sizes" placeholder="اللون / القياسات مثال أسود · M,L,XL">'+qtyControl('qnty')+'<input class="field" id="buy" type="number" placeholder="سعر الشراء للقطعة"><input class="field" id="sell" type="number" placeholder="سعر البيع للقطعة">';ok.onclick=()=>{d.p.unshift({n:document.getElementById('pn').value||'منتج جديد',q:getQty('qnty'),b:+document.getElementById('buy').value||0,v:+document.getElementById('sell').value||0,s:document.getElementById('sizes').value});save();render();closeM()}}else if(t==='sale'){mt.textContent='بيع سريع';md.textContent='حدد المنتج والكمية.';mb.innerHTML='<select class="field" id="sel">'+d.p.map((x,i)=>`<option value="${i}">${x.n} — ${x.q} قطعة</option>`).join('')+'</select>'+qtyControl('saleqty');ok.onclick=()=>{let x=d.p[+document.getElementById('sel').value],q=getQty('saleqty');if(x&&x.q>=q){x.q-=q;d.sales+=x.v*q;d.profit+=(x.v-x.b)*q;d.orders++;save();render();closeM()}else alert('الكمية غير متوفرة')}}else if(t==='return'){mt.textContent='مرتجع';md.textContent='اختر المنتج وحدد الكمية لإرجاعها للمخزون.';mb.innerHTML='<select class="field" id="rsel">'+d.p.map((x,i)=>`<option value="${i}">${x.n}</option>`).join('')+'</select>'+qtyControl('rqty');ok.onclick=()=>{let x=d.p[+document.getElementById('rsel').value],q=getQty('rqty');if(x){x.q+=q;d.sales=Math.max(0,d.sales-x.v*q);d.profit-=((x.v-x.b)*q);save();render();closeM()}}}else{mt.textContent='التعرّف بالكاميرا';md.textContent='وجّه الكاميرا على تيكت الملابس. هذه نسخة تجريبية للواجهة؛ التعرف الفعلي يحتاج ربط الكاميرا وOCR.';mb.innerHTML='<div class="scanbox">📷<small>بدون الحاجة لطباعة باركود: لاحقًا نقرأ الاسم والقياس واللون من التيكت ثم نطلب منك التأكيد قبل البيع أو المرتجع.</small></div>';ok.onclick=closeM}ok.textContent='تم'}function closeM(){document.getElementById('modal').classList.remove('open')}render();
</script></body></html>
