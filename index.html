<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>محلي | إدارة محلك</title>
<style>
:root{--bg:#f5f7f8;--card:#fff;--text:#172024;--muted:#68757a;--line:#e2e8e8;--brand:#0f766e;--brand2:#115e59;--soft:#e8f5f3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:1050px;margin:auto;padding:18px 15px 105px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0;color:var(--muted);font-size:12px}.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff}
.hero{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 25px #17202412}.heroTop{display:flex;justify-content:space-between;gap:15px}.hero h2{margin:0 0 5px;font-size:21px}.hero p{margin:0;color:#d8f2ef;font-size:13px}.today{background:#fff2;border:1px solid #fff3;border-radius:13px;padding:9px 12px;text-align:center;min-width:105px}.today small{display:block;color:#d8f2ef}.today strong{font-size:18px}.clothing{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;padding:12px;border-radius:15px;background:#ffffff12;border:1px solid #ffffff18}.clothing span{font-size:30px}.clothing small{color:#d8f2ef}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}.quick button{background:#fff;color:var(--text);border:0;border-radius:12px;padding:13px;text-align:right;min-height:67px}.quick b{display:block;font-size:13px}.quick span{font-size:11px;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.head h3{font-size:16px;margin:0}.link{background:none;color:var(--brand);font-size:12px;border:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 6px 20px #17202409}.stat small{color:var(--muted)}.stat strong{display:block;margin-top:7px;font-size:18px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:13px}.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafcfc;outline:none}.product{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.product:last-child{border:0}.name{font-weight:700;font-size:13px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.badge{background:var(--soft);color:var(--brand2);padding:5px 8px;border-radius:8px;font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{background:#fafcfc;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:right;min-height:72px}.action b{display:block;font-size:12px}.action span{font-size:10px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}.navin{max-width:650px;margin:auto;display:flex;justify-content:space-around;padding:7px 6px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:var(--muted);font-size:12px;min-width:62px;min-height:55px;border-radius:12px;padding:6px 8px}.nav .active{color:var(--brand);font-weight:700;background:var(--soft)}
.modal{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:flex-end;justify-content:center;padding:15px}.modal.open{display:flex}.sheet{background:#fff;width:min(650px,100%);border-radius:20px;padding:18px;max-height:90vh;overflow:auto}.sheet h3{margin:0 0 6px}.sheet p{font-size:12px;color:var(--muted)}.field,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:6px 0;background:#fff;outline:none}.row{display:flex;gap:8px;margin-top:10px}.primary,.secondary{padding:13px 16px;border-radius:11px;border:0;min-height:46px}.primary{background:var(--brand);color:#fff}.secondary{background:#eef2f2}
.qtybox{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0}.qtybtn{width:52px;height:52px;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--brand2);font-size:28px;font-weight:800;line-height:1;touch-action:manipulation;user-select:none}.qtyvalue{min-width:58px;text-align:center;font-size:22px;font-weight:800}.qtyhint{text-align:center;color:var(--muted);font-size:11px;margin-top:-3px}
.aihero{background:linear-gradient(135deg,#eefaf8,#f7fbfa);border:1px solid #d5ece8;border-radius:15px;padding:14px}.aihero b{color:var(--brand2)}.result{background:#fafcfc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:9px}.tag{display:inline-block;background:var(--soft);color:var(--brand2);padding:4px 7px;border-radius:7px;font-size:11px;margin:2px}.scanbox{padding:28px 16px;text-align:center;background:#f5f7f8;border-radius:14px;font-size:42px}.scanbox small{display:block;font-size:12px;color:var(--muted);margin-top:7px}.note{font-size:11px;color:var(--muted);line-height:1.7}.danger{color:#b42318}.empty{text-align:center;padding:22px;color:var(--muted);font-size:12px}
@media(max-width:700px){.quick,.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.heroTop{align-items:flex-start}.today{min-width:90px}.clothing{justify-content:flex-start}.nav button{min-width:58px}}
</style></head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">م</div><div><h1>محلي</h1><p>إدارة محلك، أبسط وأذكى.</p></div></div><button class="icon" onclick="settings()">☰</button></header>
<section class="hero"><div class="heroTop"><div><h2>هلا بيك 👋</h2><p>تابع المخزون والمبيعات والأرباح من مكان واحد.</p></div><div class="today"><small>مبيعات اليوم</small><strong id="sales">0 د.ع</strong></div></div>
<div class="clothing"><span>👕</span><span>👖</span><span>👟</span><small>إدارة ملابسك ومخزونك بسرعة</small></div>
<div class="quick">
<button onclick="openM('ai')">🤖 <b>المحلل الذكي</b><span>اكتب البضاعة بطريقتك</span></button>
<button onclick="openM('sale')">⚡ <b>بيع سريع</b><span>بدون باركود</span></button>
<button onclick="openM('scan')">📷 <b>باركود / تيكت</b><span>للسرعة عند الزحمة</span></button>
<button onclick="openM('add')">＋ <b>إضافة بضاعة</b><span>يدوي أو بالـAI</span></button>
</div></section>
<div class="head"><h3>نظرة سريعة</h3></div>
<section class="stats"><div class="stat"><small>الأرباح</small><strong id="profit">0 د.ع</strong></div><div class="stat"><small>المبيعات</small><strong id="orders">0</strong></div><div class="stat"><small>القطع</small><strong id="units">0</strong></div><div class="stat"><small>منخفض المخزون</small><strong id="low">0</strong></div></section>
<div class="grid"><section><div class="head"><h3>المخزون</h3><button class="link" onclick="openM('add')">+ إضافة</button></div><div class="card"><input class="search" id="q" oninput="render()" placeholder="ابحث عن منتج..."><div id="list"></div></div></section>
<section><div class="head"><h3>اختصارات</h3></div><div class="card actions"><button class="action" onclick="openM('addName')">🏷️ <b>قطعة باسمها فقط</b><span>أسرع إدخال</span></button><button class="action" onclick="openM('sale')">🧾 <b>تسجيل بيع</b><span>يخصم من المخزون</span></button><button class="action" onclick="openM('return')">↩️ <b>مرتجع</b><span>يرجع للمخزون</span></button><button class="action" onclick="openM('scan')">📷 <b>قراءة التيكت</b><span>المرحلة القادمة OCR</span></button></div></section></div></div>
<nav class="nav"><div class="navin"><button class="active">⌂<br>الرئيسية</button><button onclick="openM('inventory')">▦<br>المخزون</button><button onclick="openM('sale')">▤<br>المبيعات</button><button onclick="report()">◔<br>الأرباح</button><button onclick="settings()">⚙<br>الإعدادات</button></div></nav>
<div class="modal" id="modal"><div class="sheet"><h3 id="mt"></h3><p id="md"></p><div id="mb"></div><div class="row"><button class="secondary" onclick="closeM()">إلغاء</button><button class="primary" id="ok">تم</button></div></div></div>
<script>
let d=JSON.parse(localStorage.getItem('mahalli')||'null')||{sales:0,profit:0,orders:0,p:[
{n:'تراك رياضي - نيلي',q:50,s:'M,L,XL',color:'نيلي',b:15000,v:25000},
{n:'فانيلة - أحمر',q:10,s:'M,L',color:'أحمر',b:7000,v:12000},
{n:'حذاء رياضي',q:6,s:'41,42,43',color:'',b:30000,v:45000}]};
const money=n=>Number(n||0).toLocaleString('ar-IQ')+' د.ع';
function save(){localStorage.setItem('mahalli',JSON.stringify(d))}
function render(){let query=(document.getElementById('q')?.value||'').trim();document.getElementById('list').innerHTML=d.p.filter(x=>(x.n+' '+(x.color||'')+' '+(x.s||'')).includes(query)).map((x,i)=>`<div class="product"><div><div class="name">${x.n}</div><div class="meta">${x.color||'بدون لون'} · ${x.s||'بدون قياسات'} · شراء ${money(x.b)} · بيع ${money(x.v)}</div></div><span class="badge">${x.q} قطعة</span></div>`).join('')||'<div class="empty">لا توجد منتجات.</div>';let u=d.p.reduce((a,x)=>a+x.q,0);sales.textContent=money(d.sales);profit.textContent=money(d.profit);orders.textContent=d.orders;units.textContent=u;low.textContent=d.p.filter(x=>x.q<=5).length}
function qtyControl(id,initial=1,max=null){return `<div class="qtybox"><button type="button" class="qtybtn" id="${id}m">−</button><div class="qtyvalue" id="${id}">${initial}</div><button type="button" class="qtybtn" id="${id}p">＋</button></div><div class="qtyhint">اضغط مطوّلًا للتسارع ⚡</div>`}
function setupQty(id,max=null,min=1){let el=document.getElementById(id),mi=document.getElementById(id+'m'),pl=document.getElementById(id+'p');if(!el)return;let timer=null,interval=null,speed=1;function stop(){clearTimeout(timer);clearInterval(interval);timer=interval=null;speed=1}function set(v){v=Math.max(min,v);if(max!==null)v=Math.min(max,v);el.textContent=v}function one(dir){set((+el.textContent||1)+dir)}function hold(dir){stop();one(dir);timer=setTimeout(()=>{interval=setInterval(()=>{speed=Math.min(10,speed+1);set((+el.textContent||1)+dir*speed)},180)},420)}[[mi,-1],[pl,1]].forEach(([b,dir])=>{b.addEventListener('pointerdown',e=>{e.preventDefault();hold(dir)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,stop))})}
function getQty(id){return Math.max(1,+document.getElementById(id)?.textContent||1)}
function closeM(){modal.classList.remove('open')}
function openM(t){
 modal.classList.add('open');let title=document.getElementById('mt'),desc=document.getElementById('md'),body=document.getElementById('mb'),ok=document.getElementById('ok');ok.textContent='تم';
 if(t==='ai'){aiModal();return}
 if(t==='add'){title.textContent='📦 إضافة بضاعة';desc.textContent='أضف الاسم، اللون، القياسات، الكمية، سعر الشراء والبيع.';body.innerHTML=`<input class="field" id="pn" placeholder="اسم المنتج"><input class="field" id="pc" placeholder="اللون"><input class="field" id="ps" placeholder="القياسات مثال M,L,XL">${qtyControl('addq')}<input class="field" id="buy" type="number" placeholder="سعر الشراء للقطعة"><input class="field" id="sell" type="number" placeholder="سعر البيع للقطعة">`;setupQty('addq');ok.onclick=()=>{d.p.unshift({n:pn.value.trim()||'منتج جديد',q:getQty('addq'),s:ps.value,color:pc.value,b:+buy.value||0,v:+sell.value||0});save();render();closeM()};return}
 if(t==='addName'){title.textContent='🏷️ إضافة قطعة باسمها فقط';desc.textContent='أسرع طريقة إذا أنت مشغول: اسم + كمية، والباقي تضيفه لاحقاً.';body.innerHTML=`<input class="field" id="onlyname" placeholder="مثلاً: تراك أسود">${qtyControl('onlyq')}<div class="note">بعد الحفظ تقدر تضيف اللون والقياسات والأسعار من تعديل المنتج.</div>`;setupQty('onlyq');ok.onclick=()=>{let name=onlyname.value.trim();if(!name)return alert('اكتب اسم القطعة');d.p.unshift({n:name,q:getQty('onlyq'),s:'',color:'',b:0,v:0});save();render();closeM()};return}
 if(t==='sale'){title.textContent='⚡ بيع سريع';desc.textContent='اختيار المنتج + الكمية. ما تحتاج باركود.';body.innerHTML=`<select class="field" id="sel">${d.p.map((x,i)=>`<option value="${i}">${x.n} — ${x.q} قطعة</option>`).join('')}</select>${qtyControl('saleq')}<div class="note">إذا عندك زبائن هواي، هذا الخيار أسرع من الكاميرا.</div>`;setupQty('saleq',d.p[0]?.q||1);ok.onclick=()=>{let x=d.p[+sel.value],q=getQty('saleq');if(x&&x.q>=q){x.q-=q;d.sales+=x.v*q;d.profit+=(x.v-x.b)*q;d.orders++;save();render();closeM()}else alert('الكمية غير متوفرة')};return}
 if(t==='return'){title.textContent='↩️ مرتجع';desc.textContent='إرجاع القطعة للمخزون.';body.innerHTML=`<select class="field" id="rsel">${d.p.map((x,i)=>`<option value="${i}">${x.n}</option>`).join('')}</select>${qtyControl('returnq')}`;setupQty('returnq');ok.onclick=()=>{let x=d.p[+rsel.value],q=getQty('returnq');if(x){x.q+=q;d.sales=Math.max(0,d.sales-x.v*q);d.profit-=((x.v-x.b)*q);save();render();closeM()}};return}
 if(t==='scan'){title.textContent='📷 باركود / تيكت الملابس';desc.textContent='اختيار سريع للقطعة بالتصوير. واجهة جاهزة للربط بالكاميرا وOCR.';body.innerHTML=`<div class="scanbox">📷<small>وجّه الكاميرا على الباركود أو تيكت الملابس.<br>النسخة القادمة: قراءة الاسم + اللون + القياس + السعر ثم مراجعة قبل الحفظ.</small></div><div class="note" style="margin-top:10px">مهم: ما نخلي الكاميرا تفرض نفسها عليك؛ إذا أنت مشغول استخدم البيع السريع.</div>`;ok.onclick=closeM;return}
 if(t==='inventory'){inventory();return}
}
function aiModal(){
 let title=document.getElementById('mt'),desc=document.getElementById('md'),body=document.getElementById('mb'),ok=document.getElementById('ok');
 title.textContent='🤖 المحلل الذكي';desc.textContent='اكتب البضاعة مثل ما تحچيها، ومحلي يرتبها لك قبل الحفظ.';
 body.innerHTML=`<div class="aihero"><b>مثال</b><div class="note">جبت ٥٠ تراك أسود، ٢٠ تراك نيلي، القياسات M و L و XL، شراء ١٥ ألف، بيع ٢٥ ألف. وجبت ١٠ فانيلات حمر شراء ٧ آلاف بيع ١٢ ألف.</div></div><textarea id="aitext" rows="6" placeholder="اكتب تفاصيل البضاعة هنا..."></textarea><div id="aires"></div>`;
 ok.textContent='حلّل';ok.onclick=()=>{let text=aitext.value.trim();if(!text)return alert('اكتب تفاصيل البضاعة أولاً');let items=parseAI(text);showAIResults(items)}
}
function num(s){let x=(s||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/٬/g,'').replace(/,/g,'');return +x||0}
function parseAI(text){
 let chunks=text.split(/(?:\s+و(?=\s*(?:جبت|جاب|شراء|بيع|سعر))|(?=جبت\s+)|(?=وجبت\s+)|\n)/).map(x=>x.trim()).filter(Boolean), out=[];
 chunks.forEach(c=>{let q=(c.match(/(\d+|[٠-٩]+)\s*(?:قطعة|قطع|حبة)?/)||[])[1];let buy=(c.match(/(?:شراء|كلفة|كلفته|اشتريته)\s*(?:بـ|ب|:)?\s*(\d[\d٬,]*)\s*(?:ألف|الاف|آلاف)?/)||[])[1];let sell=(c.match(/(?:بيع|أبيعه|ابيعه|سعر البيع)\s*(?:بـ|ب|:)?\s*(\d[\d٬,]*)\s*(?:ألف|الاف|آلاف)?/)||[])[1];let colors=(c.match(/(?:لون|ألوان)\s*[:\-]?\s*([^،,.]+)|\b(أسود|ابيض|أبيض|أحمر|احمر|نيلي|أزرق|ازرق|أخضر|اخضر|رمادي|بيج|بني|وردي|زهري|كحلي)\b/i)||[])[1]||'';let sizes=(c.match(/(?:قياسات|مقاسات|قياس)\s*(?:[:\-]|\s)\s*([A-Za-z0-9٠-٩,،\/\sXLMS]+)/i)||[])[1]||'';let clean=c.replace(/(?:جبت|وجبت|جاب)/g,'').replace(/\b(?:شراء|كلفة|كلفته|بيع|أبيعه|ابيعه|سعر البيع)\b.*$/i,'').trim();clean=clean.replace(/^\d+\s*/,'').trim();if(q||clean)out.push({name:clean||'منتج',qty:num(q),color:colors.replace(/[،,].*$/,''),sizes:sizes.trim(),buy:buy?num(buy)*( /ألف|الاف|آلاف/.test(c)?1000:1):0,sell:sell?num(sell)*( /ألف|الاف|آلاف/.test(c)?1000:1):0})});
 return out.filter(x=>x.qty||x.name)
}
function showAIResults(items){
 let r=document.getElementById('aires');r.innerHTML='<div class="result"><b>نتيجة التحليل — راجعها قبل الحفظ</b>'+items.map((x,i)=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${x.name}</b><br><span class="tag">${x.qty||0} قطعة</span><span class="tag">${x.color||'لون غير محدد'}</span><span class="tag">${x.sizes||'قياسات غير محددة'}</span><span class="tag">شراء ${money(x.buy)}</span><span class="tag">بيع ${money(x.sell)}</span></div>`).join('')+'</div><button class="primary" style="width:100%;margin-top:10px" onclick="saveAIItems()">حفظ الكل بالمخزون ✅</button>';window._aiItems=items}
function saveAIItems(){(window._aiItems||[]).forEach(x=>d.p.unshift({n:x.name,q:x.qty||0,s:x.sizes,color:x.color,b:x.buy||0,v:x.sell||0}));save();render();closeM()}
function inventory(){let body=document.getElementById('mb');document.getElementById('mt').textContent='📦 المخزون';document.getElementById('md').textContent='عدّل الكمية بسرعة أو أضف قطعة جديدة.';body.innerHTML=`<button class="primary" style="width:100%;margin-bottom:8px" onclick="openM('addName')">🏷️ إضافة قطعة باسمها فقط</button>${d.p.map((x,i)=>`<div class="product"><div><div class="name">${x.n}</div><div class="meta">${x.color||'بدون لون'} · ${x.s||'بدون قياسات'}</div></div><div style="display:flex;align-items:center;gap:6px"><button class="qtybtn" style="width:42px;height:42px;font-size:22px" onclick="adjust(${i},-1)">−</button><b>${x.q}</b><button class="qtybtn" style="width:42px;height:42px;font-size:22px" onclick="adjust(${i},1)">＋</button></div></div>`).join('')}`;document.getElementById('ok').onclick=closeM;document.getElementById('modal').classList.add('open')}
function adjust(i,delta){d.p[i].q=Math.max(0,d.p[i].q+delta);save();render();inventory()}
function report(){alert('الأرباح الحالية: '+money(d.profit)+'\\nالمبيعات: '+money(d.sales)+'\\nعدد عمليات البيع: '+d.orders)}
function settings(){alert('محلي — نسخة تجريبية\\nبياناتك محفوظة محلياً على هذا الجهاز.')}
render();
</script></body></html>
