<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e"><title>محلي | إدارة محلك</title>
<style>
:root{--bg:#f5f7f8;--card:#fff;--text:#172024;--muted:#68757a;--line:#e2e8e8;--brand:#0f766e;--brand2:#115e59;--soft:#e8f5f3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:1050px;margin:auto;padding:18px 15px 88px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:var(--brand);color:white;display:grid;place-items:center;font-weight:800;font-size:20px}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0;color:var(--muted);font-size:12px}.icon{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:white}
.hero{background:linear-gradient(135deg,#0f766e,#115e59);color:white;border-radius:18px;padding:20px;box-shadow:0 8px 25px #17202412}.heroTop{display:flex;justify-content:space-between;gap:15px}.hero h2{margin:0 0 5px;font-size:21px}.hero p{margin:0;color:#d8f2ef;font-size:13px}.today{background:#fff2;border:1px solid #fff3;border-radius:12px;padding:9px 12px;text-align:center;min-width:105px}.today small{display:block;color:#d8f2ef}.today strong{font-size:18px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}.quick button{background:white;color:var(--text);border:0;border-radius:11px;padding:12px;text-align:right}.quick b{display:block;font-size:13px}.quick span{font-size:11px;color:var(--muted)}
.head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.head h3{font-size:16px;margin:0}.link{background:none;color:var(--brand);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 6px 20px #17202409}.stat small{color:var(--muted)}.stat strong{display:block;margin-top:7px;font-size:18px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:13px}.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fafcfc;outline:none}.product{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.product:last-child{border:0}.name{font-weight:700;font-size:13px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.badge{background:var(--soft);color:var(--brand2);padding:5px 8px;border-radius:8px;font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{background:#fafcfc;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:right}.action b{display:block;font-size:12px}.action span{font-size:10px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;backdrop-filter:blur(12px);border-top:1px solid var(--line)}.navin{max-width:650px;margin:auto;display:flex;justify-content:space-around;padding:8px}.nav button{border:0;background:none;color:var(--muted);font-size:11px}.nav .active{color:var(--brand);font-weight:700}
.modal{display:none;position:fixed;inset:0;background:#0006;z-index:10;align-items:flex-end;justify-content:center;padding:15px}.modal.open{display:flex}.sheet{background:white;width:min(620px,100%);border-radius:18px;padding:18px;max-height:88vh;overflow:auto}.sheet h3{margin:0 0 6px}.sheet p{font-size:12px;color:var(--muted)}.field,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:white}.row{display:flex;gap:8px;margin-top:8px}.primary,.secondary{padding:11px 16px;border-radius:10px;border:0}.primary{background:var(--brand);color:white}.secondary{background:#eef2f2}
@media(max-width:700px){.quick,.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.heroTop{align-items:flex-start}.today{min-width:90px}}
</style></head>
<body><div class="app">
<header><div class="brand"><div class="logo">م</div><div><h1>محلي</h1><p>إدارة محلك، أبسط وأذكى.</p></div></div><button class="icon">☾</button></header>
<section class="hero"><div class="heroTop"><div><h2>هلا بيك 👋</h2><p>تابع المخزون والمبيعات والأرباح من مكان واحد.</p></div><div class="today"><small>مبيعات اليوم</small><strong id="sales">0 د.ع</strong></div></div>
<div class="quick"><button onclick="openM('sale')">⚡ <b>بيع سريع</b><span>بدون باركود</span></button><button onclick="openM('scan')">▣ <b>مسح باركود</b><span>للزحمة والسرعة</span></button><button onclick="openM('add')">＋ <b>إضافة بضاعة</b><span>يدوي أو AI</span></button><button onclick="openM('ai')">✦ <b>مساعد AI</b><span>حلّل محلك</span></button></div></section>
<div class="head"><h3>نظرة سريعة</h3><button class="link">التقارير</button></div>
<section class="stats"><div class="stat"><small>الأرباح</small><strong id="profit">0 د.ع</strong></div><div class="stat"><small>المبيعات</small><strong id="orders">0</strong></div><div class="stat"><small>القطع</small><strong id="units">0</strong></div><div class="stat"><small>منخفض المخزون</small><strong id="low">0</strong></div></section>
<div class="grid"><section><div class="head"><h3>المخزون</h3><button class="link" onclick="openM('add')">+ إضافة</button></div><div class="card"><input class="search" id="q" oninput="render()" placeholder="ابحث عن منتج..."><div id="list"></div></div></section>
<section><div class="head"><h3>اختصارات</h3></div><div class="card actions"><button class="action" onclick="openM('add')">📦 <b>إضافة بضاعة</b><span>شراء + بيع</span></button><button class="action" onclick="openM('sale')">🧾 <b>تسجيل بيع</b><span>يخصم من المخزون</span></button><button class="action" onclick="openM('ai')">🤖 <b>إضافة بالذكاء</b><span>اكتبها بطريقتك</span></button><button class="action" onclick="openM('scan')">📷 <b>الباركود</b><span>سريع عند الزحمة</span></button></div></section></div></div>
<nav class="nav"><div class="navin"><button class="active">⌂<br>الرئيسية</button><button>▦<br>المخزون</button><button>▤<br>المبيعات</button><button>◔<br>الأرباح</button><button>⚙<br>الإعدادات</button></div></nav>
<div class="modal" id="modal"><div class="sheet"><h3 id="mt"></h3><p id="md"></p><div id="mb"></div><div class="row"><button class="secondary" onclick="closeM()">إلغاء</button><button class="primary" id="ok">تم</button></div></div></div>
<script>
let d=JSON.parse(localStorage.getItem('mahalli')||'null')||{sales:0,profit:0,orders:0,p:[{n:'تراك رياضي - نيلي',q:50,s:'M,L,XL',b:15000,v:25000},{n:'فانيلة - أحمر',q:10,s:'M,L',b:7000,v:12000},{n:'حذاء رياضي',q:6,s:'41,42,43',b:30000,v:45000}]};
const money=n=>Number(n).toLocaleString('ar-IQ')+' د.ع';function save(){localStorage.setItem('mahalli',JSON.stringify(d))}
function render(){let q=document.getElementById('q').value;document.getElementById('list').innerHTML=d.p.filter(x=>x.n.includes(q)).map(x=>`<div class="product"><div><div class="name">${x.n}</div><div class="meta">${x.s||'بدون قياسات'} · شراء ${money(x.b)} · بيع ${money(x.v)}</div></div><span class="badge">${x.q} قطعة</span></div>`).join('')||'<p class="meta">لا توجد منتجات.</p>';let u=d.p.reduce((a,x)=>a+x.q,0);sales.textContent=money(d.sales);profit.textContent=money(d.profit);orders.textContent=d.orders;units.textContent=u;low.textContent=d.p.filter(x=>x.q<=5).length}
function openM(t){modal.classList.add('open');if(t==='add'){mt.textContent='إضافة بضاعة';md.textContent='ندخل اليدوي الآن، وبعدها نركب الإدخال الذكي بالـAI.';mb.innerHTML='<input class="field" id="n" placeholder="اسم المنتج"><input class="field" id="qnty" type="number" placeholder="الكمية"><input class="field" id="buy" type="number" placeholder="سعر الشراء للقطعة"><input class="field" id="sell" type="number" placeholder="سعر البيع للقطعة"><input class="field" id="sizes" placeholder="القياسات مثال M,L,XL">';ok.onclick=()=>{d.p.unshift({n:n.value||'منتج جديد',q:+qnty.value||0,b:+buy.value||0,v:+sell.value||0,s:sizes.value});save();render();closeM()}}else if(t==='sale'){mt.textContent='بيع سريع';md.textContent='بدون باركود — مناسب إذا عندك زبائن هواي.';mb.innerHTML='<select class="field" id="sel">'+d.p.map((x,i)=>`<option value="${i}">${x.n} — ${x.q} قطعة</option>`).join('')+'</select><input class="field" id="qty" type="number" min="1" value="1">';ok.onclick=()=>{let x=d.p[+sel.value],q=+qty.value||1;if(x&&x.q>=q){x.q-=q;d.sales+=x.v*q;d.profit+=(x.v-x.b)*q;d.orders++;save();render();closeM()}else alert('الكمية غير متوفرة')}}else if(t==='scan'){mt.textContent='مسح باركود';md.textContent='هنا سنوصل كاميرا الآيفون بالباركود في الخطوة القادمة.';mb.innerHTML='<div style="padding:35px;text-align:center;background:#f5f7f8;border-radius:12px;font-size:38px">▣<div style="font-size:12px;color:#68757a">الكاميرا جاهزة للتركيب</div></div>';ok.onclick=closeM}else{mt.textContent='إضافة بالذكاء الاصطناعي';md.textContent='مثال: جبت 50 تراك نيلي، شراء 15 ألف، بيع 25 ألف، والقياسات M,L,XL.';mb.innerHTML='<textarea id="ait" rows="5" placeholder="اكتب البضاعة بطريقتك..."></textarea><div id="air" style="font-size:12px;color:#0f766e"></div>';ok.textContent='تحليل';ok.onclick=()=>air.textContent='تم استلام النص ✓ — بالنسخة القادمة سيحوّله AI تلقائياً إلى منتجات وكميات وأسعار وقياسات.';return}ok.textContent='تم'}
function closeM(){modal.classList.remove('open');ok.textContent='تم'}render();
</script></body></html>
