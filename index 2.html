<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>محلي | إدارة المحل</title>
<style>
:root{--bg:#f4f7f7;--card:#fff;--text:#172024;--muted:#6b777b;--line:#e1e8e8;--brand:#0f766e;--brand2:#115e59;--soft:#e8f5f3;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.app{max-width:1050px;margin:auto;padding:16px 15px 105px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:900}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0}.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff}
.hero{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;border-radius:20px;padding:19px;box-shadow:0 12px 30px #0f766e20}.heroTop{display:flex;justify-content:space-between;gap:12px}.hero h2{font-size:21px;margin:0 0 5px}.hero p{font-size:13px;color:#d9f2ef;margin:0}.today{min-width:108px;text-align:center;background:#fff1;border:1px solid #ffffff25;border-radius:13px;padding:9px}.today small{display:block;color:#d9f2ef;font-size:11px}.today strong{font-size:17px}.clothing{display:flex;justify-content:center;align-items:center;gap:13px;margin-top:15px;padding:11px;border-radius:14px;background:#ffffff10;border:1px solid #ffffff18}.clothing span{font-size:29px}.clothing small{font-size:11px;color:#d9f2ef}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.quick button{min-height:66px;border:0;border-radius:12px;background:#fff;text-align:right;padding:12px;color:var(--text)}.quick b{display:block;font-size:13px}.quick span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.head{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 9px}.head h3{font-size:16px;margin:0}.link{border:0;background:none;color:var(--brand);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:0 8px 25px #1720240d}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:17px;margin-top:6px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fafcfc}.product{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.product:last-child{border:0}.name{font-weight:800;font-size:13px}.meta{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.7}.badge{white-space:nowrap;background:var(--soft);color:var(--brand2);padding:6px 8px;border:0;border-radius:8px;font-size:11px}.warn{background:#fff1dc;color:#8b5200}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{min-height:72px;text-align:right;border:1px solid var(--line);border-radius:11px;background:#fafcfc;padding:12px}.action b{display:block;font-size:12px}.action span{font-size:10px;color:var(--muted)}
.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(14px);border-top:1px solid var(--line)}.navin{max-width:650px;margin:auto;display:flex;justify-content:space-around;padding:6px 5px calc(6px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:var(--muted);min-width:60px;min-height:53px;border-radius:11px;font-size:11px}.nav .active{background:var(--soft);color:var(--brand);font-weight:800}
.modal{display:none;position:fixed;z-index:30;inset:0;background:#0007;align-items:flex-end;justify-content:center;padding:12px}.modal.open{display:flex}.sheet{width:min(680px,100%);max-height:91vh;overflow:auto;background:#fff;border-radius:20px;padding:17px}.sheet h3{margin:0 0 5px;font-size:18px}.desc,.mini{color:var(--muted);font-size:11px;line-height:1.8}.field,textarea,select{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;margin:7px 0}.row{display:flex;gap:8px;margin-top:10px}.primary,.secondary,.dangerBtn{flex:1;border:0;border-radius:11px;padding:12px;min-height:46px}.primary{background:var(--brand);color:#fff}.secondary{background:#eef2f2}.dangerBtn{background:#fff0ef;color:var(--danger)}
.qtybox{display:flex;justify-content:center;align-items:center;gap:14px;margin:12px 0 4px}.qtybtn{width:50px;height:50px;border:1px solid #d8e5e3;border-radius:14px;background:var(--soft);color:var(--brand2);font-size:27px;font-weight:900;touch-action:manipulation;user-select:none}.qtyvalue{min-width:55px;text-align:center;font-size:22px;font-weight:900}.qtyhint{text-align:center;color:var(--muted);font-size:10px}.aihero{padding:14px;border-radius:15px;background:#eef9f7;border:1px solid #d4ebe7}.aihero b{color:var(--brand2)}.result{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafcfc}.resultItem{padding:10px 0;border-bottom:1px solid var(--line)}.resultItem:last-child{border:0}.tag{display:inline-block;background:var(--soft);color:var(--brand2);padding:4px 7px;border-radius:7px;font-size:10px;margin:3px 2px 0 0}.scanbox{border:1px dashed #b9cfcc;border-radius:15px;background:#f6faf9;padding:20px;text-align:center}.scanbox .cam{font-size:43px}.scanbox small{display:block;color:var(--muted);font-size:11px;line-height:1.8}.camera{width:100%;border-radius:14px;background:#111;max-height:48vh;object-fit:cover}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);font-size:12px;padding:24px}.toast{position:fixed;z-index:50;bottom:90px;left:50%;transform:translateX(-50%);background:#172024;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;display:none;max-width:90%;text-align:center}.toast.show{display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.profit{font-weight:800;color:var(--brand2)}.pill{border-radius:20px;background:#f1f4f4;padding:5px 8px;font-size:10px;color:var(--muted)}
@media(max-width:700px){.quick,.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.today{min-width:91px}.clothing{justify-content:flex-start}.three{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">م</div><div><h1>محلي</h1><p>إدارة محلك، أبسط وأذكى.</p></div></div><button class="icon" onclick="settings()">☰</button></header>
<section class="hero"><div class="heroTop"><div><h2>هلا بيك 👋</h2><p>كل شغل المحل بمكان واحد، والباركود اختياري.</p></div><div class="today"><small>مبيعات اليوم</small><strong id="sales">0 د.ع</strong></div></div>
<div class="clothing"><span>👕</span><span>👖</span><span>👟</span><small>سهل لصاحب المحل حتى وهو مزدحم</small></div>
<div class="quick"><button onclick="openM('ai')">🤖 <b>المحلل الذكي</b><span>اكتب البضاعة بطريقتك</span></button><button onclick="openM('sale')">⚡ <b>بيع سريع</b><span>بدون باركود</span></button><button onclick="openM('scan')">📷 <b>باركود / تيكت</b><span>اختياري وقت الزحمة</span></button><button onclick="openM('add')">＋ <b>إضافة بضاعة</b><span>يدوي أو AI</span></button></div></section>
<div class="head"><h3>نظرة سريعة</h3></div><section class="stats"><div class="stat"><small>الربح</small><strong id="profit">0 د.ع</strong></div><div class="stat"><small>المبيعات</small><strong id="orders">0</strong></div><div class="stat"><small>كل القطع</small><strong id="units">0</strong></div><div class="stat"><small>قريب ينفد</small><strong id="low">0</strong></div></section>
<div class="grid"><section><div class="head"><h3>المخزون</h3><button class="link" onclick="openM('inventory')">عرض الكل</button></div><div class="card"><input class="search" id="search" oninput="renderProducts()" placeholder="ابحث بالاسم، اللون، القياس أو الباركود..."><div id="products"></div></div></section>
<section><div class="head"><h3>اختصارات</h3></div><div class="card actions"><button class="action" onclick="openM('addName')">🏷️ <b>قطعة باسمها فقط</b><span>اسم + كمية بسرعة</span></button><button class="action" onclick="openM('sale')">🧾 <b>تسجيل بيع</b><span>يخصم من المخزون</span></button><button class="action" onclick="openM('return')">↩️ <b>مرتجع</b><span>يرجع للمخزون</span></button><button class="action" onclick="openM('scan')">📷 <b>قراءة تيكت</b><span>كاميرا + باركود</span></button></div></section></div></div>
<nav class="nav"><div class="navin"><button class="active" onclick="closeM()">⌂<br>الرئيسية</button><button onclick="openM('inventory')">▦<br>المخزون</button><button onclick="openM('sale')">▤<br>المبيعات</button><button onclick="openM('report')">◔<br>الأرباح</button><button onclick="settings()">⚙<br>الإعدادات</button></div></nav>
<div class="modal" id="modal"><div class="sheet"><h3 id="mt"></h3><p class="desc" id="md"></p><div id="mb"></div><div class="row"><button class="secondary" onclick="closeM()">إلغاء</button><button class="primary" id="ok">تم</button></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='mahalli_final_v1';
let d=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem('mahalli')||'null')||{sales:0,profit:0,orders:0,p:[],history:[]};
if(!d.p)d.p=d.products||[];
d.p=d.p.map((x,i)=>({id:x.id||Date.now()+i,n:x.n||x.name||'منتج',q:+(x.q??x.qty??0),s:x.s||x.sizes||'',color:x.color||'',b:+(x.b??x.buy??0),v:+(x.v??x.sell??0),barcode:x.barcode||''}));
function save(){localStorage.setItem(KEY,JSON.stringify(d))}
function money(n){return Number(n||0).toLocaleString('ar-IQ')+' د.ع'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function note(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function render(){let u=d.p.reduce((a,x)=>a+x.q,0);sales.textContent=money(d.sales);profit.textContent=money(d.profit);orders.textContent=d.orders;units.textContent=u;low.textContent=d.p.filter(x=>x.q<=5).length;renderProducts()}
function renderProducts(){let q=(search?.value||'').toLowerCase();let a=d.p.filter(x=>(x.n+' '+x.color+' '+x.s+' '+x.barcode).toLowerCase().includes(q));products.innerHTML=a.map(x=>`<div class="product"><div><div class="name">${esc(x.n)}</div><div class="meta">${esc(x.color||'بدون لون')} · ${esc(x.s||'بدون قياسات')} · ${x.barcode?'باركود '+esc(x.barcode):'بدون باركود'}<br>شراء ${money(x.b)} · بيع ${money(x.v)} · ربح <span class="profit">${money(x.v-x.b)}</span></div></div><button class="badge ${x.q<=5?'warn':''}" onclick="edit(${x.id})">${x.q} قطعة</button></div>`).join('')||'<div class="empty">ماكو منتجات مطابقة.</div>'}
function closeM(){modal.classList.remove('open');stopCam();render()}
function setupQty(id,initial=1,max=null){let e=document.getElementById(id),mi=document.getElementById(id+'m'),pl=document.getElementById(id+'p');if(!e)return;let timer,interval,speed=1;function stop(){clearTimeout(timer);clearInterval(interval);timer=interval=null;speed=1}function set(v){v=Math.max(1,v);if(max!==null)v=Math.min(max,v);e.textContent=v}function hold(dir){stop();set(+e.textContent+dir);timer=setTimeout(()=>interval=setInterval(()=>{speed=Math.min(10,speed+1);set(+e.textContent+dir*speed)},170),420)}[[mi,-1],[pl,1]].forEach(([b,dir])=>{b.onpointerdown=x=>{x.preventDefault();hold(dir)};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,stop))})}
function qbox(id,n=1){return `<div class="qtybox"><button class="qtybtn" id="${id}m" type="button">−</button><div class="qtyvalue" id="${id}">${n}</div><button class="qtybtn" id="${id}p" type="button">＋</button></div><div class="qtyhint">ضغط مطوّل = تسارع ⚡</div>`}
function qval(id){return Math.max(1,+document.getElementById(id)?.textContent||1)}
function openM(t){modal.classList.add('open');ok.textContent='تم';if(t==='ai')return ai();if(t==='add')return add();if(t==='addName')return addName();if(t==='sale')return sale();if(t==='return')return ret();if(t==='scan')return scan();if(t==='inventory')return inventory();if(t==='report')return report();if(t==='settings')return settings()}
function base(a,b){mt.textContent=a;md.textContent=b;mb.innerHTML=''}
function add(){base('📦 إضافة بضاعة','الاسم، اللون، القياسات، الكمية، الشراء والبيع.');mb.innerHTML=`<input class="field" id="pn" placeholder="اسم القطعة"><div class="two"><input class="field" id="pc" placeholder="اللون"><input class="field" id="ps" placeholder="M,L,XL"></div>${qbox('aq')}<div class="two"><input class="field" id="pb" type="number" placeholder="سعر الشراء"><input class="field" id="pv" type="number" placeholder="سعر البيع"></div><input class="field" id="pbar" placeholder="الباركود (اختياري)"><button class="secondary" style="width:100%" onclick="openM('ai')">🤖 عندك عدة قطع؟ خلي المحلل يرتبها</button>`;setupQty('aq');ok.onclick=()=>{if(!pn.value.trim())return note('اكتب اسم القطعة');d.p.unshift({id:Date.now(),n:pn.value.trim(),q:qval('aq'),color:pc.value,s:ps.value,b:+pb.value||0,v:+pv.value||0,barcode:pbar.value});save();closeM();note('تمت الإضافة ✅')}}
function addName(){base('🏷️ إضافة قطعة باسمها فقط','أسرع خيار: الاسم والكمية، وباقي التفاصيل لاحقاً.');mb.innerHTML=`<input class="field" id="on" placeholder="مثلاً تراك أسود">${qbox('oq')}<div class="mini">تگدر تعدل كل التفاصيل من بطاقة القطعة.</div>`;setupQty('oq');ok.onclick=()=>{if(!on.value.trim())return note('اكتب الاسم');d.p.unshift({id:Date.now(),n:on.value.trim(),q:qval('oq'),color:'',s:'',b:0,v:0,barcode:''});save();closeM();note('تمت إضافة القطعة 🏷️')}}
function sale(){base('⚡ بيع سريع','الباركود مو إجباري. اختار القطعة واضغط +.');if(!d.p.length){mb.innerHTML='<div class="empty">المخزون فارغ.</div>';ok.onclick=closeM;return}mb.innerHTML=`<select class="field" id="sp">${d.p.map(x=>`<option value="${x.id}">${esc(x.n)} — ${x.q} قطعة</option>`).join('')}</select>${qbox('sq')}<div class="two"><button class="secondary" onclick="openM('scan')">📷 باركود</button><button class="secondary" onclick="openM('addName')">＋ قطعة جديدة</button></div>`;setupQty('sq',1,d.p[0].q);ok.onclick=()=>{let x=d.p.find(p=>p.id==sp.value),q=qval('sq');if(!x||q>x.q)return note('الكمية غير متوفرة');x.q-=q;d.sales+=x.v*q;d.profit+=(x.v-x.b)*q;d.orders++;d.history=d.history||[];d.history.unshift({t:'بيع',n:x.n,q,total:x.v*q});save();closeM();note('تم البيع ⚡')}}
function ret(){base('↩️ مرتجع','إرجاع القطعة إلى المخزون.');mb.innerHTML=`<select class="field" id="rp">${d.p.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select>${qbox('rq')}`;setupQty('rq');ok.onclick=()=>{let x=d.p.find(p=>p.id==rp.value),q=qval('rq');if(!x)return;x.q+=q;d.sales=Math.max(0,d.sales-x.v*q);d.profit-=((x.v-x.b)*q);save();closeM();note('تم المرتجع ↩️')}}
function inventory(){base('📦 المخزون','زيادة ونقصان سريع، وتعديل كامل بالضغط على عدد القطع.');mb.innerHTML=`<button class="primary" style="width:100%;margin-bottom:8px" onclick="openM('addName')">🏷️ إضافة قطعة باسمها فقط</button><button class="secondary" style="width:100%;margin-bottom:8px" onclick="openM('ai')">🤖 إضافة عدة قطع بالـAI</button>`+d.p.map(x=>`<div class="product"><div><b>${esc(x.n)}</b><div class="meta">${esc(x.color||'بدون لون')} · ${esc(x.s||'بدون قياسات')}</div></div><div style="display:flex;align-items:center;gap:6px"><button class="qtybtn" style="width:40px;height:40px;font-size:22px" onclick="stock(${x.id},-1)">−</button><b>${x.q}</b><button class="qtybtn" style="width:40px;height:40px;font-size:22px" onclick="stock(${x.id},1)">＋</button></div></div>`).join('');ok.onclick=closeM}
function stock(id,n){let x=d.p.find(p=>p.id===id);x.q=Math.max(0,x.q+n);save();render();inventory()}
function edit(id){let x=d.p.find(p=>p.id===id);base('✏️ تعديل المنتج','تعديل كامل للقطعة.');mb.innerHTML=`<input class="field" id="en" value="${esc(x.n)}"><div class="two"><input class="field" id="ec" value="${esc(x.color)}" placeholder="اللون"><input class="field" id="es" value="${esc(x.s)}" placeholder="القياسات"></div>${qbox('eq',x.q)}<div class="two"><input class="field" id="eb" type="number" value="${x.b}"><input class="field" id="ev" type="number" value="${x.v}"></div><input class="field" id="eBar" value="${esc(x.barcode)}" placeholder="الباركود"><button class="dangerBtn" style="width:100%" onclick="del(${id})">حذف المنتج</button>`;setupQty('eq',x.q);ok.onclick=()=>{x.n=en.value.trim()||x.n;x.color=ec.value;x.s=es.value;x.q=qval('eq');x.b=+eb.value||0;x.v=+ev.value||0;x.barcode=eBar.value;save();closeM();note('تم حفظ التعديل ✏️')}}
function del(id){if(confirm('تحذف المنتج؟')){d.p=d.p.filter(x=>x.id!==id);save();closeM();note('تم الحذف')}}
function digits(s){return String(s||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[٬,]/g,'')}
function valMoney(s){let n=+(digits(s)||0);return /ألف|الف|آلاف/.test(s||'')?n*1000:n}
function parseAI(t){let parts=t.split(/(?:
+|(?=جبت\s)|(?=وجبت\s)|(?=ضفت\s))/i).map(x=>x.trim()).filter(Boolean);if(!parts.length)parts=[t];return parts.map((c,i)=>{let q=(c.match(/(\d+|[٠-٩]+)\s*(?:قطعة|قطع|حبة|حبات)?/)||[])[1]||0;let b=(c.match(/(?:شراء|كلفة|اشتريته|خذته)\s*(?:بـ|ب|:)?\s*([\d٠-٩٬,]+\s*(?:ألف|الف|الاف|آلاف)?)/i)||[])[1]||'';let v=(c.match(/(?:بيع|أبيعه|ابيعه|سعر البيع)\s*(?:بـ|ب|:)?\s*([\d٠-٩٬,]+\s*(?:ألف|الف|الاف|آلاف)?)/i)||[])[1]||'';let s=(c.match(/(?:قياسات|مقاسات|قياس)\s*(?:هي|:|-)?\s*([A-Za-z0-9٠-٩]+(?:\s*(?:و|,|،|\/)\s*[A-Za-z0-9٠-٩]+)*)/i)||[])[1]||'';let col=(c.match(/(?:لون|باللون)\s*(?:هو|:|-)?\s*([^،,.
]+?)(?=\s*(?:قياس|شراء|بيع|وأ|و?أبيعه|$))/i)||[])[1]||'';if(!col){let m=c.match(/أسود|سود|أبيض|ابيض|أحمر|حمر|نيلي|كحلي|أزرق|ازرق|أخضر|اخضر|رمادي|بيج|بني|وردي|زهري|موف|برتقالي/i);col=m?m[0]:''}let n=c.replace(/^(?:جبت|وجبت|ضفت)\s*/i,'').replace(/^\s*[\d٠-٩]+\s*/,'').replace(/(?:لون|باللون)\s*[^،,.
]+/i,'').replace(/(?:قياسات|مقاسات|قياس)\s*[^،,.
]+/i,'').replace(/(?:شراء|كلفة|اشتريته|خذته)\s*(?:بـ|ب|:)?\s*[\d٠-٩٬,]+\s*(?:ألف|الف|الاف|آلاف)?/i,'').replace(/(?:بيع|أبيعه|ابيعه|سعر البيع)\s*(?:بـ|ب|:)?\s*[\d٠-٩٬,]+\s*(?:ألف|الف|الاف|آلاف)?/i,'').replace(/[،,.]+$/,'').trim();return{name:n||'منتج '+(i+1),q:+digits(q)||0,color:col.trim(),s:s.trim(),b:valMoney(b),v:valMoney(v)}})}
function ai(){base('🤖 المحلل الذكي','اكتب البضاعة مثل ما تحچيها. راح يحللها ويعرضها قبل الحفظ.');mb.innerHTML=`<div class="aihero"><b>مثال</b><div class="mini">جبت ٥٠ تراك سود لون نيلي قياسات M وL وXL شراء ١٥ ألف وابيعه ٢٥ ألف. وجبت ١٠ فانيلات حمر شراء ٧ آلاف بيع ١٢ ألف.</div></div><textarea id="ait" rows="7" placeholder="اكتب البضاعة هنا..."></textarea><div class="mini">هذا محلل محلي داخل التطبيق. عند ربط API لاحقاً نقدر نخليه يفهم كلام أكثر تعقيداً.</div><div id="ar"></div>`;ok.textContent='حلّل';ok.onclick=()=>{if(!ait.value.trim())return note('اكتب البضاعة');let items=parseAI(ait.value);ar.innerHTML=`<div class="result"><b>راجع قبل الحفظ</b>${items.map(x=>`<div class="resultItem"><b>${esc(x.name)}</b><br><span class="tag">${x.q} قطعة</span><span class="tag">${esc(x.color||'لون غير محدد')}</span><span class="tag">${esc(x.s||'قياسات غير محددة')}</span><span class="tag">شراء ${money(x.b)}</span><span class="tag">بيع ${money(x.v)}</span></div>`).join('')}</div><button class="primary" style="width:100%;margin-top:8px" onclick='saveAI(${JSON.stringify(items)})'>حفظ الكل بالمخزون ✅</button>`}}
function saveAI(a){a.forEach(x=>d.p.unshift({id:Date.now()+Math.random(),n:x.name,q:x.q,color:x.color,s:x.s,b:x.b,v:x.v,barcode:''}));save();closeM();note('تمت إضافة البضاعة بالدفعة 🤖')}
let stream=null;
async function scan(){base('📷 باركود / تيكت الملابس','اختيارك: باركود أو بيع سريع. الكاميرا لا تفرض نفسها عليك.');mb.innerHTML=`<div class="scanbox"><div class="cam">📷</div><b>وجّه الكاميرا على الباركود</b><small>إذا كان المتصفح يدعم BarcodeDetector سيتم البحث تلقائياً. قراءة نص التيكت/OCR تحتاج محرك OCR لاحقاً.</small></div><video id="cam" class="camera hidden" autoplay playsinline></video><div id="scanStatus" class="mini"></div><div class="two"><button class="primary" onclick="startCam()">تشغيل الكاميرا</button><button class="secondary" onclick="stopCam()">إيقاف</button></div><button class="secondary" style="width:100%;margin-top:8px" onclick="openM('sale')">⚡ بيع سريع بدون باركود</button>`;ok.onclick=closeM}
async function startCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});cam.srcObject=stream;cam.classList.remove('hidden');if('BarcodeDetector' in window){let bd=new BarcodeDetector(),loop=async()=>{if(!stream)return;try{let a=await bd.detect(cam);if(a.length){let code=a[0].rawValue,x=d.p.find(p=>p.barcode===code);if(x){stopCam();openM('sale');setTimeout(()=>sp.value=x.id,50)}else scanStatus.textContent='الباركود '+code+' غير مسجل.'}}catch(e){}requestAnimationFrame(loop)};loop()}else scanStatus.textContent='المتصفح لا يدعم قراءة الباركود حالياً.'}catch(e){scanStatus.textContent='اسمح للموقع باستخدام الكاميرا أولاً.'}}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function report(){base('◔ الأرباح والمبيعات','ملخص الحسابات المسجلة.');let inv=d.p.reduce((a,x)=>a+x.q*x.b,0);mb.innerHTML=`<div class="three"><div class="stat"><small>المبيعات</small><strong>${money(d.sales)}</strong></div><div class="stat"><small>الربح</small><strong>${money(d.profit)}</strong></div><div class="stat"><small>قيمة المخزون</small><strong>${money(inv)}</strong></div></div><hr>${(d.history||[]).slice(0,12).map(x=>`<div class="product"><div><b>${esc(x.t)}</b><div class="meta">${esc(x.n)} · ${x.q} قطعة</div></div><span class="pill">${money(x.total)}</span></div>`).join('')||'<div class="empty">ماكو عمليات بعد.</div>'}`;ok.onclick=closeM}
function settings(){base('⚙️ الإعدادات','بيانات النسخة محفوظة على الجهاز.');mb.innerHTML=`<div class="card"><b>محلي</b><div class="mini">لا تحذف بيانات Safari/المتصفح إذا تريد الحفاظ على المخزون.</div></div><button class="secondary" style="width:100%;margin-top:8px" onclick="backup()">نسخة احتياطية للبيانات</button><button class="dangerBtn" style="width:100%;margin-top:8px" onclick="resetData()">مسح البيانات</button>`;ok.onclick=closeM}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='mahalli-backup.json';a.click();note('تم تجهيز النسخة الاحتياطية')}
function resetData(){if(confirm('متأكد تريد مسح بيانات المحل؟')){localStorage.removeItem(KEY);localStorage.removeItem('mahalli');location.reload()}}
render();
</script></body></html>
